name: Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out triggering commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test release version allocation
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Allocate version
        id: version
        run: |
          git fetch origin --tags
          python3 scripts/release_version.py

      - name: Push version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push origin "refs/tags/$TAG"

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing signing keystore secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Lint and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          ./gradlew --no-daemon lintRelease assembleRelease \
            -PappVersionCode="$VERSION" -PappVersionName="$VERSION"

      - name: Verify and package APK
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          metadata=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk)
          printf '%s\n' "$metadata"
          grep -F "package: name='com.miguellobato84.recetas' versionCode='$VERSION' versionName='$VERSION'" <<< "$metadata"
          grep -Fx "sdkVersion:'36'" <<< "$metadata"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/recetas-$TAG.apk"
          cd dist
          sha256sum "recetas-$TAG.apk" > "recetas-$TAG.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recetas-${{ steps.version.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          overwrite: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          highest=$(git tag --list | python3 -c 'import re,sys; print(max((int(t[1:]) for t in sys.stdin.read().splitlines() if re.fullmatch(r"v[1-9][0-9]*", t)), default=0))')
          latest=false
          if [ "$TAG" = "v$highest" ]; then latest=true; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "Recetas $TAG" \
              --generate-notes --latest="$latest"
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
